sonar.projectKey=JaDES-ULL_JaDES
sonar.organization=jades-ull

# Metadata
sonar.projectName=JaDES
sonar.projectVersion=1.0-SNAPSHOT

# Source & Test directories (multi-module)
sonar.sources=jades-core/src/main/java,jades-utils/src/main/java
sonar.tests=jades-core/src/test/java,jades-utils/src/test/java

# Encoding
sonar.sourceEncoding=UTF-8

# Java version
sonar.java.source=17
sonar.java.target=17

# JaCoCo Coverage Reports (multi-module)
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Exclusions (generated code, deprecated packages)
sonar.exclusions=**/factory/**,**/generated/**,**/test/**
sonar.coverage.exclusions=**/factory/**,**/test/**

# Quality Gate overrides (optional - puedes ajustar estos valores)
# Por defecto SonarCloud usa su Quality Gate estándar:
# - New Code Coverage: >= 80%
# - Overall Coverage: No mínimo por defecto
# - Duplications: <= 3%
# - Maintainability Rating: A
# - Reliability Rating: A
# - Security Rating: A

# Si quieres ser más estricto, puedes descomentar y ajustar:
# sonar.qualitygate.wait=true
